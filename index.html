<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Chess Piece</title>
    <!-- Keeping styles inline for simplicity -->
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #0a0a0c;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
        }

        img {
            width: 150px;
            margin-bottom: 20px;
            /* slight shadow so it doesn’t feel flat */
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6));
        }

        h1 {
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>

</head>

<body>
    <div class="container"> <!-- Replace src with your own chess piece image if needed --> <img src="chess-piece.png"
            alt="Chess Piece">
        <h1>I am the best</h1>
    </div>

</body>

</html>
